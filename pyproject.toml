[project]
name = "optimization-101"
version = "0.1.0"
description = "Optimization 101: your business problem is a set of equations, and a solver already knows the answer"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pulp>=2.9,<4",
    "highspy>=1.7",
    "scipy>=1.14",
    "ortools>=9.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "streamlit>=1.38",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "ty>=0.0.1a7",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbclient>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Source lives in src/ and is imported as `import src...` (src/__init__.py).
# Installing it (editable via `uv sync`) makes imports resolve in tests,
# notebooks (run from notebooks/), and the Streamlit app alike.
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "SIM", "PTH"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    # We pin PuLP <4 on purpose to keep the classic, widely-documented modeling
    # API the notebooks teach; PuLP 3.x nags about the 4.0 rewrite. Mute that.
    "ignore::DeprecationWarning:pulp",
]
